<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MateSonidos - Nivel 2</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

<header>

    <h1>🟩 Nivel 2</h1>

    <p>Ordena los números</p>

</header>

<main>

<div class="juego">

    <h2 id="pregunta">
        📘 Pregunta 1 de 10
    </h2>

    <br>

    <button onclick="repetir()">
        🔊 Escuchar nuevamente
    </button>

    <br><br>

    <div id="numeros" class="numeroGrande"></div>
<p id="consigna" class="consigna"></p>
    <br>

<p>Escribe la respuesta separando los números con espacios.</p>
    <input
        type="text"
        id="respuesta"
        placeholder="Ejemplo: 2 5 8">

    <br><br>

    <button onclick="corregir()">
        ✅ Comprobar
    </button>

    <br><br>

    <div id="resultado"></div>

    <hr>

    <p id="aciertos">
        ⭐ Aciertos: 0
    </p>

    <p id="errores">
        ❌ Errores: 0
    </p>

    <div class="progreso">

        <div id="barra"></div>

    </div>

    <br><br>

    <button onclick="volverMenu()">
        🏠 Volver al menú principal
    </button>

</div>

</main>

<script src="js/guardar.js"></script>
<script src="js/voz.js"></script>
<script src="js/secuencias.js"></script>

</body>

</html>
