<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MateSonidos - Nivel 4.1</title>

    <link rel="stylesheet"
          href="css/estilos.css">

</head>

<body>

<header>

    <h1>🔵 Nivel 4.1</h1>

    <p>Reconozco cantidades</p>

</header>


<main>

    <div class="juego">

        <h2 id="pregunta">
            Pregunta 1 de 5
        </h2>


        <p id="instruccion">

            Escucha la cantidad y escribe
            cuántos escuchaste.

        </p>


        <br>


        <button
            type="button"
            onclick="repetir()">

            🔊 Escuchar nuevamente

        </button>


        <br><br>


        <label for="respuesta">

            ¿Cuántos escuchaste?

        </label>


        <br><br>


        <input
            type="number"
            id="respuesta"
            min="1"
            max="5"
            inputmode="numeric"
            autocomplete="off"
            aria-label="Escribe cuántos escuchaste">


        <br><br>


        <button
            type="button"
            onclick="corregir()">

            ✅ Comprobar

        </button>


        <br><br>


        <div
            id="resultado"
            aria-live="assertive">
        </div>


        <hr>


        <p id="aciertos">

            ⭐ Aciertos: 0

        </p>


        <p id="errores">

            ❌ Errores: 0

        </p>


        <div
            class="progreso"
            aria-label="Progreso de la actividad">

            <div id="barra"></div>

        </div>


        <br><br>


        <button
            type="button"
            onclick="volverMenu()">

            🏠 Volver al menú principal

        </button>

    </div>

</main>


<script src="js/guardar.js"></script>

<script src="js/voz.js"></script>

<script src="js/cantidad.js"></script>


</body>

</html>
