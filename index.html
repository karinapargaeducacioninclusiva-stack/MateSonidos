<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MateSonidos</title>

    <link
        rel="stylesheet"
        href="css/estilos.css">

</head>


<body>

<header>

    <h1>🎵 MateSonidos</h1>

    <p>
        Aprender matemática con sonidos y accesibilidad
    </p>

</header>


<main>

    <section class="menu">

        <h2 id="ultimoNivel">
            Último nivel jugado: Nivel 2
        </h2>


        <nav
            id="menuPrincipal"
            aria-label="Menú principal">


            <!-- ========================= -->
            <!-- NIVEL 1 -->
            <!-- ========================= -->

            <button
                id="nivel1"
                type="button">

                🟦 Nivel 1 · Conozco los números

            </button>


            <!-- ========================= -->
            <!-- NIVEL 2 -->
            <!-- ========================= -->

            <button
                id="nivel2"
                type="button">

                🟩 Nivel 2 · Ordena los números

            </button>


            <!-- ========================= -->
            <!-- NIVEL 3 -->
            <!-- ========================= -->

            <button
                id="nivel3"
                type="button">

                🟨 Nivel 3 · Comparo números

            </button>


            <!-- ========================= -->
            <!-- CONFIGURACIÓN -->
            <!-- ========================= -->

            <button
                id="configuracion"
                type="button">

                ⚙ Configuración

            </button>


            <!-- ========================= -->
            <!-- AYUDA -->
            <!-- ========================= -->

            <button
                id="ayuda"
                type="button">

                ❓ Ayuda

            </button>


            <!-- ========================= -->
            <!-- NIVEL 4 -->
            <!-- ========================= -->

            <button
                id="nivel4"
                type="button">

                🟪 Nivel 4 · Número y cantidad

            </button>


        </nav>


        <p class="ayudaTeclado">

            ↑ ↓ Moverse
            &nbsp;&nbsp;
            Enter Seleccionar
            &nbsp;&nbsp;
            Espacio Repetir

        </p>

    </section>

</main>


<!-- ============================= -->
<!-- SISTEMA DE VOZ -->
<!-- ============================= -->

<script src="js/voz.js"></script>


<!-- ============================= -->
<!-- MENÚ PRINCIPAL -->
<!-- ============================= -->

<script src="js/menu.js"></script>


</body>

</html>
