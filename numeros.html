<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MateSonidos - Nivel 1</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

<header>

    <h1>🟦 Nivel 1</h1>

    <p>Conozco los números</p>

</header>

<main>

    <div class="juego">

        <h2 id="pregunta">
            📘 Pregunta 1 de 10
        </h2>

        <br>

        <button onclick="repetir()">
            🔊 Escuchar nuevamente
        </button>

        <br><br>

        <div id="numero" class="numeroGrande"></div>

        <br>

        <input
            type="number"
            id="respuesta"
            placeholder="Escribe el número">

        <br><br>

        <button onclick="comprobar()">
            ✅ Responder
        </button>

        <br><br>

        <div id="resultado"></div>

        <hr>

        <p id="aciertos">
            ⭐ Aciertos: 0
        </p>

        <p id="errores">
            ❌ Errores: 0
        </p>

        <div class="progreso">

            <div id="barra"></div>

        </div>

        <br><br>

        <button onclick="volverMenu()">
            🏠 Volver al menú principal
        </button>

    </div>

</main>

<script src="js/guardar.js"></script>
<script src="js/numeros.js"></script>

</body>

</html>
